name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4   # tests/test_explorer.py: hash chain JS == Python
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Benchmark (informasi, tidak memblokir)
        run: python -m bench.bench_pipeline --minutes 60 --out /tmp/benchmark.md && cat /tmp/benchmark.md >> "$GITHUB_STEP_SUMMARY"
